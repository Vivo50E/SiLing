<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <title>SiLing — Dashboard unavailable</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; padding: 32px;
      display: grid; place-items: center;
      background: #0d1117; color: #e6edf3;
      font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(480px, 100%); padding: 28px;
      background: #161b22; border: 1px solid #30363d; border-radius: 14px;
      box-shadow: 0 18px 55px rgba(0, 0, 0, .35);
    }
    img { width: 72px; height: 72px; }
    h1 { margin: 18px 0 8px; font-size: 22px; }
    p { margin: 0 0 18px; color: #8b949e; }
    code { color: #79c0ff; }
    button {
      border: 1px solid #58a6ff; border-radius: 7px; padding: 8px 13px;
      background: #58a6ff; color: #0d1117; font: inherit; font-weight: 650;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/static/icons/orchestrator-192.png" alt="" />
    <h1>Dashboard 暂时无法连接</h1>
    <p>这是本地实时控制面板，请确认 <code>siling dashboard</code> 正在运行，然后重试。</p>
    <button type="button" onclick="location.reload()">重新连接</button>
  </main>
</body>
</html>
